name: app (windows)

# Once per milestone: task PRs target a milestone branch (local checks gate them);
# the milestone PR into main runs this. workflow_dispatch runs it by hand.
on:
  pull_request:
    branches: [main]
    paths: ["app/**", "crates/tempa-core/**", ".github/workflows/app-windows.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Backend tests (ConPTY, shell, PATH)
        run: cargo test --manifest-path app/src-tauri/Cargo.toml
