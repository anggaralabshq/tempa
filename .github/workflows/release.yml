# Runs only on a version tag (v1.2.3): build binaries, attach them with checksums to a
# GitHub Release, then publish to crates.io and the Homebrew tap when their secrets exist.
# Steps for the maintainer: docs/releasing.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    needs: create-release
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: tempa
          target: ${{ matrix.target }}
          archive: tempa-$tag-$target
          include: LICENSE-MIT,LICENSE-APACHE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  crates-io:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish tempa-core, then tempa-cli
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          cargo publish -p tempa-core --locked
          cargo publish -p tempa-cli --locked

  homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the formula in anggaralabshq/homebrew-tap
        if: env.TAP_TOKEN != ''
        run: |
          mkdir dist && cd dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256'
          cd ..
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/anggaralabshq/homebrew-tap.git" tap
          mkdir -p tap/Formula
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist > tap/Formula/tempa.rb
          cd tap
          git config user.name "tempa release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/tempa.rb
          git commit -m "tempa ${GITHUB_REF_NAME}"
          git push
