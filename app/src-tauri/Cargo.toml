[package]
name = "tempa-app"
version = "0.1.0"
edition = "2024"
publish = false

# Own workspace: the CLI workspace (and its MSRV/CI image) never builds Tauri.
[workspace]

[lib]
name = "tempa_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempa-core = { path = "../../crates/tempa-core" }
