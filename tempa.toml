# tempa configuration: the single source of project rules.
[project]
name = "tempa"
tempa_version = "0.1.0"

[docs]            # role → file name, rename freely
context   = "AGENTS.md"
plan      = "docs/plans/"
decisions = "docs/decisions/"
changes   = "CHANGES.md"
harness   = "HARNESS.md"

[agents]
enabled = ["claude", "codex", "gemini", "opencode", "cursor", "copilot"]

[harness]         # run in order; each must exit 0
format = "cargo fmt --check"
lint   = "cargo clippy --workspace --all-targets -- -D warnings"
test   = "cargo test --workspace"

[gates]
plan_before_edit      = true
review_required       = false
decision_required_for = ["new-dependency", "schema-change", "public-api"]
schema_paths          = []
public_api_paths      = ["crates/tempa-core/src/lib.rs"]
max_diff_lines        = 800
protected_paths       = [".env*", ".github/workflows/**", "tempa.toml"]

[ci]
base            = "main"
skip_authors    = ["renovate[bot]"]
docs_only_paths = ["docs/**", "*.md"]
